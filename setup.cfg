[metadata]
name = glottdnn
version = 1.2.0
description = GlottDNN vocoder analysis and DNN tools
license = GPL-3.0-or-later
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = python
py_modules =
    GlottDnnScript
    TrainDnn
    data_utils
    dnnClasses
    reaper_pitch_analysis
install_requires =
    numpy
    pyyaml
    scikit-learn
    torch>=1.1

[options.extras_require]
test =
    pytest

[options.entry_points]
console_scripts =
    glottdnn = GlottDnnScript:main
